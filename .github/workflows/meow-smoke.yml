name: Meow offline smoke tests
on:
  push:
    branches: [feature/inline-recurring-entry]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run isolated offline smoke tests
        run: python tests/run_tests.py identity-preview.html
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meow-smoke-results
          path: test-results.json
          if-no-files-found: warn
