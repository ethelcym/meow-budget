name: November fresh-start safety tests
on:
  workflow_dispatch:
  push:
    branches: ['feature/**']
  pull_request:
    branches: [main]
jobs:
  validate-fresh-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run November fresh-start safety unit tests
        run: node --test tests/november-fresh-start.test.js
      - name: Run synchronization and staged migration safety tests
        run: node --test tests/sync-concurrency.test.js
      - name: Run complete Node.js safety suite
        run: node --test tests/*.test.js
