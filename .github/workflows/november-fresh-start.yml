name: November fresh-start safety tests
on:
  push:
    branches: ['feature/**']
    paths:
      - 'cloud-test.html'
      - 'tests/november-fresh-start.test.js'
      - '.github/workflows/november-fresh-start.yml'
  workflow_dispatch:
jobs:
  validate-fresh-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run November fresh-start safety unit tests
        run: node --test tests/november-fresh-start.test.js
